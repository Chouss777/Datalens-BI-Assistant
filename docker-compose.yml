services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-bi_assistant}
      POSTGRES_USER: bi_admin
      POSTGRES_PASSWORD: ${BI_ADMIN_PASSWORD:-bi-local-admin}
      TZ: Africa/Casablanca
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seed:
    image: bi-assistant:local
    build: .
    command: ["python", "seed_data.py", "--enable-vector", "--provision-reader"]
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-bi_assistant}
      DB_USER: bi_admin
      DB_PASSWORD: ${BI_ADMIN_PASSWORD:-bi-local-admin}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-bi-local-reader}
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  model-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_MODEL:-qwen2.5-coder}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  app:
    image: bi-assistant:local
    build: .
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-bi_assistant}
      DB_USER: bi_reader
      DB_PASSWORD: ${BI_READER_PASSWORD:-bi-local-reader}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder}
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    depends_on:
      seed:
        condition: service_completed_successfully
      model-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
